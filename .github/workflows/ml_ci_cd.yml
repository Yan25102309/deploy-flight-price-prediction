name: ML Flight Price Prediction CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ ml_ci_cd ]

jobs:
  ml_ci_cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: python version
        run: python --version

      - name: pip install
        run: pip install -r requirements.txt

      - name: download dataset
        if: github.event.client_payload.dataseturl != ''
        run: wget -O data/Clean_Dataset.csv ${{ github.event.clientpayload.dataseturl }}
      
      - name: cat dataset
        if: github.event.clientpayload.dataseturl != ''
        run: cat data/Clean_Dataset.csv
        
      - name: train model
        run: python model/train.py
        
      - name: docker build
        run: |
          TAG="{{ github.event.client_payload.sha }}"
          if [ -z "$TAG" ]; thenTAG="${{ github.sha }}"; fi
          docker build -t ${{ secrets.DOCKERUSER }}/${{ secrets.MODEL_NAME }}:$TAG .

      - name: show images
        run: docker images

      - name: docker login
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERPASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKERUSER" --password-stdin
      - name: docker Push
        run: |
          TAG="${{ github.event.client_payload.sha }}"
          if [ -z "$TAG"]; thenTAG="${{ github.sha }}"; fi
          docker push ${{ secrets.DOCKERUSER }}/${{ secrets.MODEL_NAME }}:$TAG
